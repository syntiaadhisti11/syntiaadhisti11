name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Update otomatis setiap hari jam 12 malam
  workflow_dispatch: # Memungkinkan kamu menjalankan manual kapan saja

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Most Used Languages Diagram
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_colors: github
          plugin_languages_limit: 8
